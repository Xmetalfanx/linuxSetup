git_theming_menu_items=(
    1 "VincelJuice Theming"
    M "Back to Main Menu"
    Q "Quit to Prompt"
)

function gitThemingMenuCaseStatement() {

    case $gitThemingMenuSelection in

	    1) gitvcThemingMenuType  ;;
        [mM]) mainMenuType ;;
        [qQ]) quitScript ;;
        *) invalidSection ;;

    esac
}

function gitThemingMenuDialog() {
    createDialogMenu
}

function gitThemingMenuEcho() {
    createEchoMenu
}

function gitThemingMenuType() {
    baseMenuName="gitThemingMenu"
    currentMenuCaseStatementName="gitThemingMenuCaseStatement"
    menuTitle="Xmetal Linux Scripts Git Related Theming Menu"

    declare -n menuArrayName=git_theming_menu_items
    declare -n currentMenuSelection=gitThemingMenuSelection

    $menuName
}
