git_vj_mcmojave_theming_menu_items=(
    1 "Install McMojave Theme"
    2 "Install McMojave Circle Icons"
    3 "Install McMojave Theme + Icons"
    M "Back to VincelJuice Theming Menu"
    Q "Quit to Prompt"
)

function gitvjMcMojaveThemingMenuCaseStatement() {

    case $gitvjMcMojaveThemingMenuSelection in
        1) install_mcmojave_theme ;;
        2) install_mcmojave_icon_circle_theme ;;
        3) install_mcmojave_theme && install_mcmojave_icon_circle_theme ;;
        [mM]) gitvjThemingMenuType ;;
        [qQ]) quitScript ;;
        *) invalidSection ;;
    esac
}

function gitvjMcMojaveThemingMenuDialog() {
    createDialogMenu
}

function gitvjMcMojaveThemingMenuEcho() {
    createEchoMenu
}

function gitvjMcMojaveThemingMenuType() {
    baseMenuName="gitvjMcMojaveThemingMenu"
    currentMenuCaseStatementName="gitvjMcMojaveThemingMenuCaseStatement"
    menuTitle="Xmetal Linux Scripts - VincelJuice McMojave Theming Menu"

    declare -n menuArrayName=git_vj_mcmojave_theming_menu_items
    declare -n currentMenuSelection=gitvjMcMojaveThemingMenuSelection

    $menuName
}
