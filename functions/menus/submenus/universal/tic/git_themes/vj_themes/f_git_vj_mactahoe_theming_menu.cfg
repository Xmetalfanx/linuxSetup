git_vj_mactahoe_theming_menu_items=(
    1 "Install MacTahoe Theme"
    2 "Install MacTahoe Icons"
    3 "Install MacTahoe Theme + Icons"
    M "Back to VincelJuice Theming Menu"
    Q "Quit to Prompt"
)

function gitvjMacTahoeThemingMenuCaseStatement() {

    case $gitvjMacTahoeThemingMenuSelection in
        1) install_mactahoe_theme ;;
        2) install_mactahoe_icon_theme ;;
        3) install_mactahoe_theme && install_mactahoe_icon_theme ;;
        [mM]) gitvjThemingMenuType ;;
        [qQ]) quitScript ;;
        *) invalidSection ;;
    esac
}

function gitvjMacTahoeThemingMenuDialog() {
    createDialogMenu
}

function gitvjMacTahoeThemingMenuEcho() {
    createEchoMenu
}

function gitvjMacTahoeThemingMenuType() {
    baseMenuName="gitvjMacTahoeThemingMenu"
    currentMenuCaseStatementName="gitvjMacTahoeThemingMenuCaseStatement"
    menuTitle="Xmetal Linux Scripts - VincelJuice MacTahoe Theming Menu"

    declare -n menuArrayName=git_vj_mactahoe_theming_menu_items
    declare -n currentMenuSelection=gitvjMacTahoeThemingMenuSelection

    $menuName
}
