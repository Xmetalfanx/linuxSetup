git_vj_matcha_theming_menu_items=(
    1 "Install Matcha Theme"
    2 "Install Icons for Matcha (not available)"
    3 "Install Matcha Theme + Icons"
    M "Back to VincelJuice Theming Menu"
    Q "Quit to Prompt"
)

function gitvjMatchaThemingMenuCaseStatement() {

    case $gitvjMatchaThemingMenuSelection in
        1) install_matcha_theme ;;
        2) vj_no_icon_theme_available ;;
        3) install_matcha_theme && vj_no_icon_theme_available ;;
        [mM]) gitvjThemingMenuType ;;
        [qQ]) quitScript ;;
        *) invalidSection ;;
    esac
}

function gitvjMatchaThemingMenuDialog() {
    createDialogMenu
}

function gitvjMatchaThemingMenuEcho() {
    createEchoMenu
}

function gitvjMatchaThemingMenuType() {
    baseMenuName="gitvjMatchaThemingMenu"
    currentMenuCaseStatementName="gitvjMatchaThemingMenuCaseStatement"
    menuTitle="Xmetal Linux Scripts - VincelJuice Matcha Theming Menu"

    declare -n menuArrayName=git_vj_matcha_theming_menu_items
    declare -n currentMenuSelection=gitvjMatchaThemingMenuSelection

    $menuName
}
