git_vj_layan_theming_menu_items=(
    1 "Install Layan Theme"
    2 "Install Icons for Layan (not available)"
    3 "Install Layan Theme + Icons"
    M "Back to VincelJuice Theming Menu"
    Q "Quit to Prompt"
)

function gitvjLayanThemingMenuCaseStatement() {

    case $gitvjLayanThemingMenuSelection in
        1) install_layan_theme ;;
        2) vj_no_icon_theme_available ;;
        3) install_layan_theme && vj_no_icon_theme_available ;;
        [mM]) gitvjThemingMenuType ;;
        [qQ]) quitScript ;;
        *) invalidSection ;;
    esac
}

function gitvjLayanThemingMenuDialog() {
    createDialogMenu
}

function gitvjLayanThemingMenuEcho() {
    createEchoMenu
}

function gitvjLayanThemingMenuType() {
    baseMenuName="gitvjLayanThemingMenu"
    currentMenuCaseStatementName="gitvjLayanThemingMenuCaseStatement"
    menuTitle="Xmetal Linux Scripts - VincelJuice Layan Theming Menu"

    declare -n menuArrayName=git_vj_layan_theming_menu_items
    declare -n currentMenuSelection=gitvjLayanThemingMenuSelection

    $menuName
}
