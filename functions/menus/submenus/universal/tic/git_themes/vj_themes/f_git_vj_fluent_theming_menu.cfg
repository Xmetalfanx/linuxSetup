git_vj_fluent_theming_menu_items=(
    1 "Install Fluent Theme"
    2 "Install Fluent Icons"
    3 "Install Fluent Theme + Icons"
    M "Back to VincelJuice Theming Menu"
    Q "Quit to Prompt"
)

function gitvjFluentThemingMenuCaseStatement() {

    case $gitvjFluentThemingMenuSelection in
        1) install_fluent_theme ;;
        2) install_fluent_icon_theme ;;
        3) install_fluent_theme && install_fluent_icon_theme ;;
        [mM]) gitvjThemingMenuType ;;
        [qQ]) quitScript ;;
        *) invalidSection ;;
    esac
}

function gitvjFluentThemingMenuDialog() {
    createDialogMenu
}

function gitvjFluentThemingMenuEcho() {
    createEchoMenu
}

function gitvjFluentThemingMenuType() {
    baseMenuName="gitvjFluentThemingMenu"
    currentMenuCaseStatementName="gitvjFluentThemingMenuCaseStatement"
    menuTitle="Xmetal Linux Scripts - VincelJuice Fluent Theming Menu"

    declare -n menuArrayName=git_vj_fluent_theming_menu_items
    declare -n currentMenuSelection=gitvjFluentThemingMenuSelection

    $menuName
}
