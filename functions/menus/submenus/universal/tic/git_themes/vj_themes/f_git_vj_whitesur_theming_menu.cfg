git_vj_whitesur_theming_menu_items=(
    1 "Install WhiteSur Theme"
    2 "Install WhiteSur Icons"
    3 "Install WhiteSur Theme + Icons"
    M "Back to VincelJuice Theming Menu"
    Q "Quit to Prompt"
)

function gitvjWhiteSurThemingMenuCaseStatement() {

    case $gitvjWhiteSurThemingMenuSelection in
        1) install_whitesur_theme ;;
        2) install_whitesur_icon_theme ;;
        3) install_whitesur_theme && install_whitesur_icon_theme ;;
        [mM]) gitvjThemingMenuType ;;
        [qQ]) quitScript ;;
        *) invalidSection ;;
    esac
}

function gitvjWhiteSurThemingMenuDialog() {
    createDialogMenu
}

function gitvjWhiteSurThemingMenuEcho() {
    createEchoMenu
}

function gitvjWhiteSurThemingMenuType() {
    baseMenuName="gitvjWhiteSurThemingMenu"
    currentMenuCaseStatementName="gitvjWhiteSurThemingMenuCaseStatement"
    menuTitle="Xmetal Linux Scripts - VincelJuice WhiteSur Theming Menu"

    declare -n menuArrayName=git_vj_whitesur_theming_menu_items
    declare -n currentMenuSelection=gitvjWhiteSurThemingMenuSelection

    $menuName
}
