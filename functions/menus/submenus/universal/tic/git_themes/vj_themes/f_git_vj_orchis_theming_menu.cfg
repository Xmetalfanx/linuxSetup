git_vj_orchis_theming_menu_items=(
    1 "Install Orchis Theme"
    2 "Install Icons for Orchis (not available)"
    3 "Install Orchis Theme + Icons"
    M "Back to VincelJuice Theming Menu"
    Q "Quit to Prompt"
)

function gitvjOrchisThemingMenuCaseStatement() {

    case $gitvjOrchisThemingMenuSelection in
        1) install_orchis_theme ;;
        2) vj_no_icon_theme_available ;;
        3) install_orchis_theme && vj_no_icon_theme_available ;;
        [mM]) gitvjThemingMenuType ;;
        [qQ]) quitScript ;;
        *) invalidSection ;;
    esac
}

function gitvjOrchisThemingMenuDialog() {
    createDialogMenu
}

function gitvjOrchisThemingMenuEcho() {
    createEchoMenu
}

function gitvjOrchisThemingMenuType() {
    baseMenuName="gitvjOrchisThemingMenu"
    currentMenuCaseStatementName="gitvjOrchisThemingMenuCaseStatement"
    menuTitle="Xmetal Linux Scripts - VincelJuice Orchis Theming Menu"

    declare -n menuArrayName=git_vj_orchis_theming_menu_items
    declare -n currentMenuSelection=gitvjOrchisThemingMenuSelection

    $menuName
}
