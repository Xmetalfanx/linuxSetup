git_vj_qogir_theming_menu_items=(
    1 "Install Qogir Theme"
    2 "Install Qogir Icons"
    3 "Install Qogir Theme + Icons"
    M "Back to VincelJuice Theming Menu"
    Q "Quit to Prompt"
)

function gitvjQogirThemingMenuCaseStatement() {

    case $gitvjQogirThemingMenuSelection in
        1) install_qoqir_theme ;;
        2) install_qoqir_icon_theme ;;
        3) install_qoqir_theme && install_qoqir_icon_theme ;;
        [mM]) gitvjThemingMenuType ;;
        [qQ]) quitScript ;;
        *) invalidSection ;;
    esac
}

function gitvjQogirThemingMenuDialog() {
    createDialogMenu
}

function gitvjQogirThemingMenuEcho() {
    createEchoMenu
}

function gitvjQogirThemingMenuType() {
    baseMenuName="gitvjQogirThemingMenu"
    currentMenuCaseStatementName="gitvjQogirThemingMenuCaseStatement"
    menuTitle="Xmetal Linux Scripts - VincelJuice Qogir Theming Menu"

    declare -n menuArrayName=git_vj_qogir_theming_menu_items
    declare -n currentMenuSelection=gitvjQogirThemingMenuSelection

    $menuName
}
