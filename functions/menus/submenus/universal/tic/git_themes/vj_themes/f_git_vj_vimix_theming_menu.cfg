git_vj_vimix_theming_menu_items=(
    1 "Install Vimix Theme"
    2 "Install Vimix Icons"
    3 "Install Vimix Theme + Icons"
    M "Back to VincelJuice Theming Menu"
    Q "Quit to Prompt"
)

function gitvjVimixThemingMenuCaseStatement() {

    case $gitvjVimixThemingMenuSelection in
        1) install_vimix_theme ;;
        2) install_vimix_icon_theme ;;
        3) install_vimix_theme && install_vimix_icon_theme ;;
        [mM]) gitvjThemingMenuType ;;
        [qQ]) quitScript ;;
        *) invalidSection ;;
    esac
}

function gitvjVimixThemingMenuDialog() {
    createDialogMenu
}

function gitvjVimixThemingMenuEcho() {
    createEchoMenu
}

function gitvjVimixThemingMenuType() {
    baseMenuName="gitvjVimixThemingMenu"
    currentMenuCaseStatementName="gitvjVimixThemingMenuCaseStatement"
    menuTitle="Xmetal Linux Scripts - VincelJuice Vimix Theming Menu"

    declare -n menuArrayName=git_vj_vimix_theming_menu_items
    declare -n currentMenuSelection=gitvjVimixThemingMenuSelection

    $menuName
}
