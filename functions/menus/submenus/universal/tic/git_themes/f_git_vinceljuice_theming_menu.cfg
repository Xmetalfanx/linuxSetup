git_theming_menu_items=(
    1 "McMojave gtk theme"
    2 "McMojave circle icon theme"
    3 "WhiteSur gtk theme"
    4 "WhiteSur icon theme"
    5 "Orchis gtk theme"
    6 "Vimix gtk theme"
    M "Back to Main Menu"
    Q "Quit to Prompt"
)

function gitThemingMenuCaseStatement() {

    case $gitThemingMenuSelection in
	    1) install_MacTahoe_gtk_theme ;;
        2) install_mcmojave_icon_circle_theme ;;
        3) install_whitesur_gtk_theme ;;
        4) install_whiteslur_icon_theme ;;
        5) install_orchis_gtk_theme ;;
        6) install_vimix_gtk_theme ;;
        [mM]) mainMenuType ;;
        [qQ]) quitScript ;;
        *) invalidSection ;;

    esac
}

function gitvcThemingMenuDialog() {
    createDialogMenu
}

function gitvcThemingMenuEcho() {
    createEchoMenu
}

function gitvcThemingMenuType() {
    baseMenuName="gitvjThemingMenu"
    currentMenuCaseStatementName="gitVJThemingMenuCaseStatement"
    menuTitle="Xmetal Linux Scripts - VincelJuice Git Related Theming Menu"

    declare -n menuArrayName=git_theming_menu_items
    declare -n currentMenuSelection=gitThemingMenuSelection

    $menuName
}
