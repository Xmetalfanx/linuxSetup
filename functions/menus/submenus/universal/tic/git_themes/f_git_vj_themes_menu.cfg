git_vj_theming_menu_items=(
    1 "McMojave Theming"
    2 "WhiteSur Theming"
    3 "Orchis Theming"
    4 "Vimix Theming"
    5 "Qogir Theming"
    6 "Fluent Theming"
    7 "MacTahoe Theming"
    8 "Matcha Theming"
    9 "Layan Theming"
    M "Back to Main Menu"
    Q "Quit to Prompt"
)

function gitvjThemingMenuCaseStatement() {

    case $gitvjThemingMenuSelection in
        1) gitvjMcMojaveThemingMenuType ;;
        2) gitvjWhiteSurThemingMenuType ;;
        3) gitvjOrchisThemingMenuType ;;
        4) gitvjVimixThemingMenuType ;;
        5) gitvjQogirThemingMenuType ;;
        6) gitvjFluentThemingMenuType ;;
        7) gitvjMacTahoeThemingMenuType ;;
        8) gitvjMatchaThemingMenuType ;;
        9) gitvjLayanThemingMenuType ;;
        [mM]) mainMenuType ;;
        [qQ]) quitScript ;;
        *) invalidSection ;;
    esac
}

function gitvjThemingMenuDialog() {
    createDialogMenu
}

function gitvjThemingMenuEcho() {
    createEchoMenu
}

function gitvjThemingMenuType() {
    baseMenuName="gitvjThemingMenu"
    currentMenuCaseStatementName="gitvjThemingMenuCaseStatement"
    menuTitle="Xmetal Linux Scripts - VincelJuice Theming Menu"

    declare -n menuArrayName=git_vj_theming_menu_items
    declare -n currentMenuSelection=gitvjThemingMenuSelection

    $menuName
}
