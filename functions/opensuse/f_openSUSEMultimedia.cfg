function get_leap_multimedia_repo() {

    # for Slowroll and Tumbleweed
    case ${openSUSEBranch} in
        slowroll | tumbleweed)
            openSUSE_MM_repo="https://download.opensuse.org/repositories/multimedia:/apps/${openSUSEBranch}/multimedia:apps.repo"
            ;;
    esac

    # for Leap
    case ${leap_branch} in
        16.0 | 16.1) "https://download.opensuse.org/repositories/multimedia:/apps/${leap_branch}/multimedia:apps.repo" ;;
    esac

}

# sort of a Metafunction
function manualOpenSuseCodecInstall() {

    # gets repo URL
    get_leap_multimedia_repo

    ## Add the Repo
    sudo zypper addrepo -r ${openSUSE_MM_repo} "repo-multimedia"

    # Install Codecs
    installApp "opensuse-codecs-installer ffmpeg gstreamer-plugins-bad gstreamer-plugins-libav gstreamer-plugins-ugly"

}
