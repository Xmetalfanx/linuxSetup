
# Similar to a "run all tasks" script, this will be the function that runs all
# the tasks that would be in the ForME scripts (maybe removed at some point
# from that folder )

## When this is called ... all the general checks and specific checks are DONE
# ... no need to redo checks

function xmetal_optimize_mirrors() {
    # optimize mirrors/repo function for faster downloads
    # Location: /functions/universal/pmanagement/f_pmanagement.cfg

    clear
    fancy_message action "(If applicable) Optimizing Repos/Mirrors"
    optimizeRepo
    fancy_message info "Mirror/Repo Optimizing Done"
    userPrompt

}

function xmetal_update_step() {
    # Universal Updater
    clear
    fancy_message action "Updating Packages"
    universal_update
    fancy_message info "Packages Updated"
    userPrompt

}

function xmetal_thirdparty_step() {
    # Third party repo function
    ## THIS DOES add (if Fedora) RPMFusion [both repos], (if openSuse) the
    ## general Packman repo
    clear
    fancy_message action "(If applicable) Adding Extra Repos"

    # the point of this case statement is that since this function is used for
    # PPAs too on Ubuntu based distros this may not make sense here ... but on
    # OpenSUSE/Fedora this installs what i want,
    # listed above
    case ${distroBase} in
        fedora|opensuse) universalAddRepo ;;
    esac

    userPrompt
    clear

}

function xmetal_codec_install() {
	###################################################################
    # Codec installation
    # location: /functions/universal/software/f_multimediaSoftware.cfg

    # I decided to put this here as some distros need the third party repo
    # added first but i wanted to do a full update BEFORE anything third party
    # was added ... before THAT

    fancy_message action "Installing Codecs"
    universalCodecInstall
    userPrompt
}

