function xmetal_install_theming() {
    clear
    fancy_message action "Installing some common theming"
    # Nov 2022: I need to revist the themes I have since i am not 100% sure
    # all are still the same or updated
    metaThemeInstall
    fancy_message info "Theming Added"
    userPrompt
}

function xmetalTasks() {

	clear

	fancy_message info "Xmetal Task's selected"
	fancy_message question \
        "Are you sure you want to run these tasks back to back?"

	fancy_message warn \
        "If you interrupt them when they are running, there MAY be problems, down the road"

	read -r -p "Your Choice? (Y/N)" xmetalTasksChoice

	case ${xmetalTasksChoice} in

	[yY])

		xmetal_optimize_mirrors

        xmetal_update_step

        xmetal_thirdparty_step

        xmetal_codec_install

        xmetal_install_common_software

        xmetal_install_theming

		fancy_message info "Xmetal's Batch scripts are DONE"
		userPrompt && clear

		;;

        [nN]) return ;;

        *) fancy_message warn "Invalid Selection" ;;

    esac

}

