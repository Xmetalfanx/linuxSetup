#######################################################################
# Numix Theming

function numixOpenSUSEInstall() {

	[ "${openSUSEBranch}" == "tumbleweed" ] && $install metatheme-numix-common gtk2-metatheme-numix gtk3-metatheme-numix && fancy_message info "Code for Numix's theming in OpenSUSE Leap removed since many of the packages are no longer in OpenSUSE Leap 'default' repos"

	# just for the reason of not pulling entire DE's in
	case $DEName in
		Cinnamon) $install cinnamon-metatheme-numix ;;
	esac
}

function nunixThemingMetaInstall() {
	clear
	fancy_message action "Installing Numix Theming"

	# numix-gtk-theme, numix-icon-theme
	fancy_message action "Installing numix-gtk-theme and numix-icon-theme"
	case $distroBase in
		debian|fedora|solus|ubuntu) $install numix-gtk-theme numix-icon-theme ;;
  	esac

	# for circle variant of the numix icon theme
	fancy_message action "Installing Numix Icon circle variant"
	case $distroBase in
		debian|fedora) $install numix-icon-theme-circle ;;
  	esac

	# for square variant of the numix icon theme
	fancy_message action "Installing Numix Icon square variant"
	case $distroBase in
		fedora|solus) $install numix-icon-theme-square ;;
  	esac

	# "Catch-all"
	case $distroBase in
		opensuse) numixOpenSUSEInstall ;;
  	esac

}

# End of Numix Theming code
#######################################################################
