# Meta Theme function
function install_layan_theme() {
   # if Plasma, run seperate function
    case $DEName in

        KDE) repo_name="Layan-kde" && return ;;
        *) repo_name="Layan-gtk-theme" ;;
    esac

    git_install_vinceljuice_repo "$repo_name"

}
