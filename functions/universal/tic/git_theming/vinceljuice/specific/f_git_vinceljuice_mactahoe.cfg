# ref: https://github.com/vinceliuice/MacTahoe-gtk-theme
# ref: https://github.com/vinceliuice/MacTahoe-kde

# ref: https://github.com/vinceliuice/MacTahoe-icon-theme
function install_mactahoe_icon_theme() {
    repo_name="MacTahoe-icon-theme"
    git_install_vinceljuice_repo "$repo_name"
}

# Meta Theme function
function install_mactahoe_theme() {
    # if Plasma, run seperate function
    case $DEName in

        KDE) repo_name="MacTahoe-kde" && return ;;
        *) repo_name="MacTahoe-gtk-theme" ;;
    esac

    git_install_vinceljuice_repo "$repo_name"

}