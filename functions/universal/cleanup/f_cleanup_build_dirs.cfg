
#######################################################
## Clean temp folder locations

function clean_home_root_build_folders() {

    local root_location_temp_folders=(
        ~/.bundle
        ~/.cargo
        ~/.cmake
        ~/.dotnet
        ~/.electron
        ~/.electron-gyp
        ~/.gem
        ~/.gradle
        ~/.lazarus
        ~/.node-gyp
        ~/.npm
        ~/.nuget
        ~/.nvm
        ~/.racket
        ~/.rustup
        ~/.stack
        ~/.yarn
    )

	fancy_message action "Cleaning various home folder root level config folders, $(printf '%s, ' "${root_location_temp_folders[@]}")"
	user_prompt

	rm -rf "${root_location_temp_folders[@]}" || true

}

function clean_home_cache_build_folders() {
    local cache_folder_temp_folders=(
        ~/.cache/electron
        ~/.cache/electron-builder
        ~/.cache/go-build
        ~/.cache/node-gyp
        ~/.cache/pip
        ~/.cache/yarn
    )

	fancy_message action "Cleaning cache folders, $(printf '%s, ' "${cache_folder_temp_folders[@]}") "
	user_prompt

	rm -rf "${cache_folder_temp_folders[@]}" || true

}

# "meta" function
function cleanTempBuildFiles() {
    clear

    fancy_message action "Cleaning temp build files"

	clean_home_root_build_folders

	clean_home_cache_build_folders

	fancy_message action "Cleaning home 'go' folder"
    sudo rm -rf ~/go || true

    user_prompt
}

# end clean temp build folders
