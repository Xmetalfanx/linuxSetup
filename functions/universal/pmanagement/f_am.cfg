#ref: https://github.com/ivan-hc/AM

function install_am() {
    clear

    # message about issues on tumbleweed related to run0 over sudo
    systemd_sudo_message

    fancy_message action "Downloading AM - AppImage Package Manager"
    wget -q https://raw.githubusercontent.com/ivan-hc/AM/main/AM-INSTALLER &&

    fancy_message action "setting AM - AppImage Package Manager installer permission"
    chmod a+x ./AM-INSTALLER

    fancy_message action "Running official AM - AppImage Package Manager installer"
    ./AM-INSTALLER

    fancy_message action "Cleanup - Removing AM installer script"
    rm ./AM-INSTALLER

    userPrompt
}

# note: despite the name this is for am or appman from the same source
# renamed to aipm for AppImage Package Manager
function detect_aipm() {

	check_command "am" && \
		appimage_package_manager_installed="yes" && \
		aipm_var="am" && \
		return

	check_command "appman" && \
		appimage_package_manager_installed="yes" && \
		aipm_var="appman" && \
		return

	appimage_package_manager_installed="no"

}

# this would be what to call from a third party software function/location
	# NOT THE FUNCTION above
function install_with_aipm() {
	local aipm_app="$1"

	# this is already ran at script run, the idea here is in case
	# my scripts install aipm so "its not installed" on first run
	# BUT it was installed since BY my scripts, so "check again"
	detect_aipm

	# if appimage package manager (whichever ... am or appman) is installed, install package with it
	[ "${appimage_package_manager_installed}" == "yes" ] && \
		# goal: " 'appman/am' -i --user <foo package>"
		$aipm_var -i --user $aipm_app && \
		return
}
