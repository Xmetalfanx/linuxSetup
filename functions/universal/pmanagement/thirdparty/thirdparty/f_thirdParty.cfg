# Checks the downloaded_file's size and remove it if zero (somehow the file exists but is not "complete")
function check_downloaded_file_size() {
	# Check if file size is zero; if so, delete it and continue as if it doesn't exist

	if [ ! -s "${downloaded_file}" ]; then
		fancy_message warning "File ${downloaded_file} exists but is zero size. Deleting and re-downloading."
		rm -f "${downloaded_file}"
	fi
}


