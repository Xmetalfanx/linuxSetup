
function detect_downloaded_file_type() {
    # if issues happen, remember i made this local
    local mime_type_check=$(file -b --mime-type "${downloaded_file}")

    # detect download file type
    case "${mime_type_check}" in
        application/x-debian-package)
            downloaded_file_type="deb" && fancy_message action "Detected DEB package"
            ;;
        application/x-rpm)
            downloaded_file_type="rpm" && fancy_message action "Detected RPM package"
            ;;
        application/zip)
            downloaded_file_type="zip" && fancy_message action "Detected ZIP archive"
            ;;
        application/x-executable|application/x-iso9660-appimage)
            downloaded_file_type="appimage" && fancy_message action "Detected AppImage"

			appimage_final_location="/home/$USER/Applications/"

            ;;
        application/x-gzip|application/gzip)
            downloaded_file_type="tar" && fancy_message action "Detected tar.gz archive"
            ;;
        application/x-bzip2)
            downloaded_file_type="tar" && fancy_message action "Detected tar.bz2 archive"
            ;;
        application/x-xz)
            downloaded_file_type="tar" && fancy_message action "Detected tar.xz archive"
            ;;
        application/x-tar)
            downloaded_file_type="tar" && fancy_message action "Detected tar archive"
            ;;
        *)
            fancy_message info "Unknown or unhandled MIME type: ${mime_type_check}"
            ;;
    esac

}

function handle_downloaded_tar_files() {
    # get tar compression info
    if [ "${downloaded_file_type}" == "tar" ]; then

        case "${mime_type_check}" in
            application/x-gzip|application/gzip) tar_compression="gzip" && fancy_message action "Detected gz archive" ;;
            application/x-bzip2) tar_compression="bzip" && fancy_message action "Detected bz2/bzip archive" ;;
            application/x-xz) tar_compression="xz" && fancy_message action "Detected xz archive" ;;
            application/x-tar) tar_compression="none" && fancy_message action "Detected tar archive without compression" ;;
        esac
    fi

    # what to do, based on detected compression
    case "${tar_compression}" in

        gzip) tar -zxvf "${downloaded_file}" -C "${finalProgramLocation}" ;;
        bzip) tar -jxvf "${downloaded_file}" -C "${finalProgramLocation}" ;;
        xz) tar -xf "${downloaded_file}" -C "${finalProgramLocation}"  ;;
        none) tar -xvf "${downloaded_file}" -C "${finalProgramLocation}" ;;
        *) fancy_message error "Error detecting tar compression" ;;

    esac

}

function handle_downloaded_nontar_files() {
# for non-tar files
    case "${downloaded_file_type}" in
        deb)
            # deb-get check needs to be here
            aptInstallDEB
            ;;
        rpm) $install "${downloaded_file}" ;;
        zip) unzip "${downloaded_file}" -d "$programName"
            ;;
        application/x-executable|application/x-iso9660-appimage)
            fancy_message action "Detected AppImage"

			appimage_final_location="/home/$USER/Applications/"

			appImageExecutable "${downloaded_file}"

            ;;
    esac
}

# Nov 2026: run this on the downloaded file
    # issue: links with .git at the end; would they even get here?
function check_file_mime_type() {
    # ?? if the file doesn't exist, would it even get to this point?
	# ?? if that is the case, there is no point to the if statement directly below
	# Uses file -i to get the MIME type of the downloaded file
    [ ! -f "${downloaded_file}" ] && fancy_message error "File ${downloaded_file} does not exist" && return 1

    detect_downloaded_file_type

    # ? - should this be moved to under, where this fuction is called?
    [ "${downloaded_file_type}" == "tar"] && handle_downloaded_tar_files || handle_downloaded_nontar_files

}



# Checks for the final location in /home/$USER/Programs
function handleDownloaded_CheckExtractedFolder() {

	# check for extracted download dir
	case ${fileEXT} in
		tar|tar.bz2|tar.gz|tar.xz|tgz)
			fancy_message action "Checking for ${finalProgramLocation} directory"

			[ ! -d "${finalProgramLocation}" ] && fancy_message info "Making Directory ${finalProgramLocation}" && mkdir -p ${finalProgramLocation} || fancy_message info "Directory ${finalProgramLocation} already exists" || userPrompt

	esac
}

# handles downloaded files after downloaded
function handleDownloaded() {

	echo "Handling Download"

	# idea for apps i need to extract to ~/Programs/$programName
	finalProgramLocation="${programDir}/${programName}"

	fancy_message action "\nExtracting/Installing $fileNameWEXT"

	check_file_mime_type

	# checks for extracted folder and creates it if it doesn't exist, for some file types
	handleDownloaded_CheckExtractedFolder

	# "if fileEXT contains 'tar' should be here

	if [[ "${fileEXT}" == *"tar"* ]]; then
		# check to see if finalProgramLocation exists (IT SHOULD at this point)
		[ -d "${finalProgramLocation}" ] && echo -e "${finalProgramLocation} location does exist"  || echo -e "${finalProgramLocation} does not exit"

	fi

	#cleanup_downloaded_file
}
